databaseChangeLog:
  - changeSet:
      id: 02-cart-module
      author: ryszardpanda
      changes:

        # --- CART -----------------------------------------------------------
        - createTable:
            tableName: cart_entity
            columns:
              - column:
                  name: cart_id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_cart_entity
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: user_id
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                    unique: true

        # --- CART ITEM ------------------------------------------------------
        - createTable:
            tableName: cart_item_entity
            columns:
              - column:
                  name: cart_item_id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_cart_item
              - column:
                  name: product_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: price
                  type: DECIMAL(19,2)
                  constraints:
                    nullable: false
              - column:
                  name: type
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: quantity
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: cart_id
                  type: BIGINT
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            constraintName: fk_cart_item_cart
            baseTableName: cart_item_entity
            baseColumnNames: cart_id
            referencedTableName: cart_entity
            referencedColumnNames: cart_id
            onDelete: CASCADE

        - addIndex:
            indexName: idx_cart_item_cartid
            tableName: cart_item_entity
            columns:
              - column:
                  name: cart_id

        # --- CART ITEM CONFIGURATION ---------------------------------------
        - createTable:
            tableName: cart_item_configuration_entity
            columns:
              - column:
                  name: cart_item_configuration_id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_cart_item_cfg
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: price
                  type: DECIMAL(19,2)
                  constraints:
                    nullable: false
              - column:
                  name: type
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: cart_item_id
                  type: BIGINT
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            constraintName: fk_cfg_cart_item
            baseTableName: cart_item_configuration_entity
            baseColumnNames: cart_item_id
            referencedTableName: cart_item_entity
            referencedColumnNames: cart_item_id
            onDelete: CASCADE

        - addIndex:
            indexName: idx_cfg_cart_itemid
            tableName: cart_item_configuration_entity
            columns:
              - column:
                  name: cart_item_id
